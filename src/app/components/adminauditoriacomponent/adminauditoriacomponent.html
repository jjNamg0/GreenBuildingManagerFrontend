<section class="contenedor-pagina">
  <div class="encabezado-pagina">
    <div>
      <span class="sobretitulo mb-2">Control</span>
      <h1 class="titulo-pagina">Auditoría</h1>
      <p class="texto-tenue mb-0">
        Registro de todo lo que pasa en el sistema: persona, fecha, motivo y ubicación.
      </p>
    </div>
    <span class="gb-insignia exito"
      ><i class="fa-solid fa-shield-halved"></i>Solo administrador</span
    >
  </div>

  <div class="gb-tarjeta p-3 mb-3">
    <form class="row g-3 align-items-end" (ngSubmit)="buscar()" novalidate>
      <div class="col-12 col-md-6 col-xl-3">
        <label for="usuarioAuditoria" class="form-label">Persona</label>
        <input
          id="usuarioAuditoria"
          name="usuario"
          class="form-control form-control-sm"
          placeholder="Nombre o correo"
          [(ngModel)]="filtros.usuario"
        />
      </div>
      <div class="col-12 col-md-6 col-xl-3">
        <label for="accionAuditoria" class="form-label">Acción</label>
        <select
          id="accionAuditoria"
          name="accion"
          class="form-select form-select-sm"
          [(ngModel)]="filtros.accion"
        >
          <option *ngFor="let accion of ACCIONES" [ngValue]="accion.valor">
            {{ accion.texto }}
          </option>
        </select>
      </div>
      <div class="col-6 col-xl-2">
        <label for="desdeAuditoria" class="form-label">Desde</label>
        <input
          id="desdeAuditoria"
          name="desde"
          type="date"
          class="form-control form-control-sm"
          [(ngModel)]="filtros.desde"
        />
      </div>
      <div class="col-6 col-xl-2">
        <label for="hastaAuditoria" class="form-label">Hasta</label>
        <input
          id="hastaAuditoria"
          name="hasta"
          type="date"
          class="form-control form-control-sm"
          [(ngModel)]="filtros.hasta"
        />
      </div>
      <div class="col-12 col-xl-2 d-flex gap-2">
        <button class="btn-gb btn-gb-sm flex-grow-1" type="submit">
          <i class="fa-solid fa-filter"></i>Filtrar
        </button>
        <button
          class="btn-gb-borde btn-gb-sm"
          type="button"
          title="Limpiar filtros"
          (click)="limpiar()"
        >
          <i class="fa-solid fa-rotate-left"></i>
        </button>
      </div>
    </form>
  </div>

  <div class="gb-tarjeta">
    <app-cargandocomponent [activo]="cargando()" texto="Cargando registros..." />

    <app-alertacomponent
      [mensaje]="error()"
      clases="m-3"
      textoAccion="Reintentar"
      (accion)="cargar()"
    />

    <app-vaciocomponent
      [visible]="sinRegistros"
      icono="fa-clipboard-list"
      titulo="No hay registros con estos filtros"
    />

    <div class="table-responsive" *ngIf="hayRegistros">
      <table class="gb-tabla">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Persona</th>
            <th>Acción</th>
            <th>Motivo</th>
            <th>Ubicación</th>
          </tr>
        </thead>
        <tbody>
          <tr
            app-filaauditoriacomponent
            *ngFor="let registro of registros"
            [registro]="registro"
          ></tr>
        </tbody>
      </table>
    </div>

    <app-paginacioncomponent
      [pagina]="numeroPagina"
      [totalPaginas]="totalPaginas"
      [totalElementos]="totalRegistros"
      [bloqueado]="cargando()"
      (cambiar)="irAPagina($event)"
    />
  </div>
</section>
