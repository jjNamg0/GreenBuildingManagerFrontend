<section class="contenedor-pagina">
  <div class="encabezado-pagina">
    <div>
      <span class="sobretitulo mb-2">Administración</span>
      <h1 class="titulo-pagina">Usuarios</h1>
      <p class="texto-tenue mb-0">
        Residentes registrados. Asigna su unidad para que puedan usar el conjunto.
      </p>
    </div>
  </div>

  <div class="gb-tarjeta">
    <div
      class="d-flex flex-wrap gap-3 justify-content-between align-items-center p-3 borde-inferior"
    >
      <form class="d-flex gap-2 buscador" (ngSubmit)="cargar()" novalidate>
        <input
          name="busqueda"
          class="form-control form-control-sm"
          placeholder="Buscar por nombre o correo"
          [(ngModel)]="busqueda"
        />
        <button class="btn-gb-borde btn-gb-sm" type="submit">
          <i class="fa-solid fa-magnifying-glass"></i>Buscar
        </button>
      </form>
      <div class="gb-pildoras">
        <button
          type="button"
          *ngFor="let opcion of FILTROS"
          [class.activo]="filtro === opcion.valor"
          (click)="elegirFiltro(opcion.valor)"
        >
          {{ opcion.texto }}
        </button>
      </div>
    </div>

    <app-cargandocomponent [activo]="cargando()" texto="Cargando usuarios..." />

    <app-alertacomponent
      [mensaje]="error()"
      clases="m-3"
      textoAccion="Reintentar"
      (accion)="cargar()"
    />

    <app-vaciocomponent
      [visible]="sinUsuarios"
      icono="fa-users"
      titulo="No hay usuarios con este filtro"
    />

    <div class="table-responsive" *ngIf="hayUsuarios">
      <table class="gb-tabla">
        <thead>
          <tr>
            <th>Usuario</th>
            <th>Rol</th>
            <th>Conjunto y unidad</th>
            <th>Estado</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr
            app-filausuariocomponent
            *ngFor="let usuario of usuarios()"
            [usuario]="usuario"
            (asignar)="usuarioAsignando.set($event)"
            (cambiarEstado)="cambiarEstado($event)"
            (eliminar)="eliminar($event)"
          ></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<app-asignarunidadcomponent
  *ngIf="usuarioAsignando() as usuario"
  [usuario]="usuario"
  [conjuntos]="conjuntos()"
  (cerrar)="usuarioAsignando.set(null)"
  (asignado)="alAsignar()"
/>
