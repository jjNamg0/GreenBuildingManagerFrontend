<div class="gb-tarjeta p-4">
  <h2 class="h6 mb-3">Cambiar contraseña</h2>
  <app-alertacomponent [mensaje]="error()" clases="mb-3" />
  <form (ngSubmit)="cambiarPassword()" novalidate>
    <div class="row g-3">
      <div class="col-12">
        <label for="actual" class="form-label">Contraseña actual</label>
        <input
          id="actual"
          name="actual"
          type="password"
          class="form-control"
          autocomplete="current-password"
          [(ngModel)]="datos.passwordActual"
        />
      </div>
      <div class="col-12 col-sm-6">
        <label for="nueva" class="form-label">Nueva contraseña</label>
        <input
          id="nueva"
          name="nueva"
          type="password"
          class="form-control"
          autocomplete="new-password"
          [(ngModel)]="datos.passwordNueva"
        />
      </div>
      <div class="col-12 col-sm-6">
        <label for="confirmar" class="form-label">Confirmar nueva contraseña</label>
        <input
          id="confirmar"
          name="confirmar"
          type="password"
          class="form-control"
          autocomplete="new-password"
          [(ngModel)]="confirmarPassword"
        />
      </div>
    </div>
    <button class="btn-gb-borde mt-4" type="submit" [disabled]="guardando()">
      <span [class]="claseSpinner(guardando(), 'fa-key')"></span>Cambiar contraseña
    </button>
  </form>
</div>
