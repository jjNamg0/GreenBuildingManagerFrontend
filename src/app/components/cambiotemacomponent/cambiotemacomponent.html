<button
  class="cambio-tema"
  type="button"
  (click)="alternar()"
  [attr.aria-label]="esOscuro() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
  [title]="esOscuro() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
>
  <i
    class="fa-solid"
    [class.fa-sun]="esOscuro()"
    [class.fa-moon]="!esOscuro()"
    [class.girando]="girando()"
  ></i>
</button>
