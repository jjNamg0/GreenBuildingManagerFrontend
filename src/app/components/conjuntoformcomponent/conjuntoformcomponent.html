<div
  class="modal gb-modal"
  tabindex="-1"
  role="dialog"
  aria-modal="true"
  aria-labelledby="tituloConjunto"
>
  <div class="modal-dialog modal-xl">
    <div class="modal-content animate__animated animate__fadeInDown animate__faster">
      <form (ngSubmit)="guardar()" novalidate>
        <div class="modal-header">
          <h2 id="tituloConjunto" class="modal-title h5">{{ titulo }}</h2>
          <button
            type="button"
            class="btn-close"
            aria-label="Cerrar"
            (click)="cerrar.emit()"
          ></button>
        </div>

        <div class="modal-body">
          <app-alertacomponent [mensaje]="error()" clases="mb-3" />

          <div class="row g-4">
            <div class="col-12 col-lg-6">
              <div class="mb-3">
                <label for="nombreConjunto" class="form-label">Nombre del conjunto</label>
                <input
                  id="nombreConjunto"
                  name="nombre"
                  class="form-control"
                  placeholder="Torres del Parque"
                  [(ngModel)]="datos.nombre"
                />
              </div>
              <div class="mb-3">
                <span class="form-label d-block">Tipo de conjunto</span>
                <div class="gb-segmentos">
                  <button
                    type="button"
                    *ngFor="let tipo of TIPOS"
                    [class.activo]="datos.tipo === tipo.valor"
                    (click)="datos.tipo = tipo.valor"
                  >
                    <i class="fa-solid {{ tipo.icono }}"></i>{{ tipo.texto }}
                  </button>
                </div>
              </div>
              <div class="row g-3 mb-3">
                <div class="col-12 col-sm-6">
                  <label for="municipio" class="form-label">Municipio</label>
                  <input
                    id="municipio"
                    name="municipio"
                    class="form-control"
                    placeholder="Chía"
                    [(ngModel)]="datos.municipio"
                  />
                </div>
                <div class="col-12 col-sm-6">
                  <label for="direccion" class="form-label">Dirección</label>
                  <input
                    id="direccion"
                    name="direccion"
                    class="form-control"
                    placeholder="Calle 10 # 5-20"
                    [(ngModel)]="datos.direccion"
                  />
                </div>
              </div>
              <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea
                  id="descripcion"
                  name="descripcion"
                  class="form-control"
                  rows="3"
                  [(ngModel)]="datos.descripcion"
                ></textarea>
              </div>
              <div>
                <label for="imagen" class="form-label">Imagen (URL, opcional)</label>
                <input
                  id="imagen"
                  name="imagen"
                  class="form-control"
                  placeholder="https://..."
                  [(ngModel)]="datos.imagenUrl"
                />
              </div>
            </div>

            <div class="col-12 col-lg-6">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="form-label mb-0">Ubicación en el mapa</span>
                <button class="btn-gb-fantasma btn-gb-sm" type="button" (click)="usarMiUbicacion()">
                  <i class="fa-solid fa-location-crosshairs"></i>Usar mi ubicación
                </button>
              </div>
              <div #contenedorMapa class="mini-mapa mb-2"></div>
              <p class="small texto-bajo mb-3">
                <i class="fa-solid fa-hand-pointer me-1"></i>Haz clic en el mapa para marcar el
                conjunto.
              </p>
              <div class="row g-3">
                <div class="col-6">
                  <label for="latitud" class="form-label">Latitud</label>
                  <input
                    id="latitud"
                    name="latitud"
                    type="number"
                    step="0.000001"
                    class="form-control form-control-sm"
                    [(ngModel)]="datos.latitud"
                    (change)="actualizarMarcadorDesdeCampos()"
                  />
                </div>
                <div class="col-6">
                  <label for="longitud" class="form-label">Longitud</label>
                  <input
                    id="longitud"
                    name="longitud"
                    type="number"
                    step="0.000001"
                    class="form-control form-control-sm"
                    [(ngModel)]="datos.longitud"
                    (change)="actualizarMarcadorDesdeCampos()"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn-gb-borde" type="button" (click)="cerrar.emit()">Cancelar</button>
          <button class="btn-gb" type="submit" [disabled]="guardando()">
            <span [class]="claseSpinner(guardando(), 'fa-floppy-disk')"></span>{{ textoBoton }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
