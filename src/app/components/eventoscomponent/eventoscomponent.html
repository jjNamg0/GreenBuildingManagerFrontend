<section class="contenedor-pagina">
  <div class="encabezado-pagina">
    <div>
      <span class="sobretitulo mb-2">Mi conjunto</span>
      <h1 class="titulo-pagina">Eventos</h1>
      <p class="texto-tenue mb-0">
        Fiestas, asambleas y actividades en las instalaciones de tu conjunto.
      </p>
    </div>
  </div>

  <app-vaciocomponent
    [visible]="sinConjunto()"
    [grande]="true"
    [enTarjeta]="true"
    icono="fa-hourglass-half"
    titulo="Aún no tienes unidad asignada"
    texto="Cuando la administración te asigne tu unidad verás aquí los eventos de tu conjunto."
  />

  <ng-container *ngIf="!sinConjunto()">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
      <div class="gb-pildoras">
        <button type="button" [class.activo]="filtros.tipo === ''" (click)="elegirTipo('')">
          Todos
        </button>
        <button
          type="button"
          *ngFor="let tipo of TIPOS"
          [class.activo]="filtros.tipo === tipo.valor"
          (click)="elegirTipo(tipo.valor)"
        >
          <i class="fa-solid me-1 {{ tipo.icono }}"></i>{{ tipo.texto }}
        </button>
      </div>
      <div class="form-check form-switch mb-0">
        <input
          id="soloNinos"
          class="form-check-input"
          type="checkbox"
          role="switch"
          [checked]="filtros.paraNinos"
          (change)="alternarNinos()"
        />
        <label class="form-check-label" for="soloNinos">
          <i class="fa-solid fa-children me-1"></i>Solo planes para niños
        </label>
      </div>
    </div>

    <app-cargandocomponent [activo]="cargando()" texto="Cargando eventos..." />

    <app-alertacomponent [mensaje]="error()" textoAccion="Reintentar" (accion)="cargar()" />

    <app-vaciocomponent
      [visible]="sinEventos"
      [grande]="true"
      [enTarjeta]="true"
      icono="fa-calendar-xmark"
      titulo="No hay eventos con estos filtros"
      texto="Cuando la administración programe un evento lo verás aquí y te llegará al correo."
    />

    <div class="row g-3" *ngIf="!cargando()">
      <div class="col-12 col-md-6 col-xl-4" *ngFor="let evento of eventos()">
        <app-tarjetaeventocomponent
          [evento]="evento"
          [procesando]="procesando() === evento.id"
          (alternarAsistencia)="alternarAsistencia($event)"
        />
      </div>
    </div>
  </ng-container>
</section>
