<ng-container *ngIf="esAdmin(); else barraGeneral">
  <app-barralateralcomponent [abierta]="menuAbierto()" (cerrar)="cerrarMenu()" />

  <header class="barra-admin">
    <button
      class="btn-gb-fantasma d-lg-none px-2"
      type="button"
      aria-label="Abrir menú"
      (click)="abrirMenu()"
    >
      <i class="fa-solid fa-bars fs-5"></i>
    </button>
    <div class="d-none d-sm-flex align-items-center gap-2 texto-tenue">
      <i class="fa-solid fa-shield-halved texto-verde"></i>
      <span>Panel de administración</span>
    </div>
    <div class="d-flex align-items-center gap-3 ms-auto">
      <app-cambiotemacomponent />
      <a class="text-end lh-sm d-none d-sm-block enlace-perfil" routerLink="/perfil">
        <div class="fw-medium">{{ nombreCompleto() }}</div>
        <div class="small texto-verde">Administrador</div>
      </a>
      <a class="avatar d-inline-flex" routerLink="/perfil" aria-label="Mi perfil">{{
        iniciales()
      }}</a>
      <button class="btn-gb-borde btn-gb-sm" type="button" (click)="cerrarSesion()">
        <i class="fa-solid fa-right-from-bracket"></i
        ><span class="d-none d-md-inline">Cerrar sesión</span>
      </button>
    </div>
  </header>
</ng-container>

<ng-template #barraGeneral>
  <header class="barra">
    <div class="barra-interior">
      <a class="marca" routerLink="/" (click)="cerrarMenu()">
        <span class="gb-icono"><i class="fa-solid fa-building-user"></i></span>
        <span class="fw-semibold">Green Building Manager</span>
      </a>

      <button
        class="btn-gb-fantasma d-xl-none ms-auto px-2"
        type="button"
        aria-label="Abrir menú"
        (click)="alternarMenu()"
      >
        <i
          class="fa-solid fs-5"
          [class.fa-bars]="!menuAbierto()"
          [class.fa-xmark]="menuAbierto()"
        ></i>
      </button>

      <div class="menu" [class.abierto]="menuAbierto()">
        <nav class="enlaces">
          <ng-container *ngIf="!haySesion()">
            <a
              routerLink="/"
              routerLinkActive="activo"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="cerrarMenu()"
              >Inicio</a
            >
          </ng-container>
          <ng-container *ngIf="haySesion()">
            <a routerLink="/mi-conjunto" routerLinkActive="activo" (click)="cerrarMenu()"
              >Mi conjunto</a
            >
            <a routerLink="/eventos" routerLinkActive="activo" (click)="cerrarMenu()">Eventos</a>
            <a routerLink="/mis-reservas" routerLinkActive="activo" (click)="cerrarMenu()"
              >Mis reservas</a
            >
            <a routerLink="/para-ti" routerLinkActive="activo" (click)="cerrarMenu()">Para ti</a>
          </ng-container>
          <a routerLink="/mapa" routerLinkActive="activo" (click)="cerrarMenu()">Mapa</a>
        </nav>

        <div class="acciones">
          <app-cambiotemacomponent />
          <ng-container *ngIf="!haySesion()">
            <a class="btn-gb-borde btn-gb-sm" routerLink="/login" (click)="cerrarMenu()"
              >Iniciar sesión</a
            >
            <a class="btn-gb btn-gb-sm" routerLink="/registro" (click)="cerrarMenu()"
              >Registrarse</a
            >
          </ng-container>
          <ng-container *ngIf="haySesion()">
            <a class="text-xl-end lh-sm enlace-perfil" routerLink="/perfil" (click)="cerrarMenu()">
              <div class="fw-medium">{{ nombreCompleto() }}</div>
              <div class="small texto-verde">Residente</div>
            </a>
            <button class="btn-gb-borde btn-gb-sm" type="button" (click)="cerrarSesion()">
              <i class="fa-solid fa-right-from-bracket"></i>Cerrar sesión
            </button>
            <a class="avatar d-none d-xl-inline-flex" routerLink="/perfil" aria-label="Mi perfil">{{
              iniciales()
            }}</a>
          </ng-container>
        </div>
      </div>
    </div>
  </header>
</ng-template>
