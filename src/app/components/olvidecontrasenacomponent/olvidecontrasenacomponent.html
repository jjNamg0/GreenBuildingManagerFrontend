<div class="gb-auth">
  <div class="gb-auth-tarjeta animate__animated animate__fadeIn">
    <div class="text-center mb-4">
      <span class="gb-icono gb-icono-grande mb-3"><i class="fa-solid fa-key"></i></span>
      <h1 class="h4 mb-1">Restablecer contraseña</h1>
      <p class="texto-tenue mb-0" *ngIf="paso() === 1; else subtituloPaso2">
        Te enviaremos un código a tu correo
      </p>
      <ng-template #subtituloPaso2>
        <p class="texto-tenue mb-0">
          Escribe el código que llegó a <strong class="texto-verde">{{ correo }}</strong> y tu nueva
          contraseña
        </p>
      </ng-template>
    </div>

    <div class="gb-segmentos mb-4" aria-hidden="true">
      <button type="button" [class.activo]="paso() === 1" tabindex="-1">
        <i class="fa-solid fa-envelope"></i>Correo
      </button>
      <button type="button" [class.activo]="paso() === 2" tabindex="-1">
        <i class="fa-solid fa-lock"></i>Nueva contraseña
      </button>
    </div>

    <app-alertacomponent [mensaje]="error()" clases="mb-3" />

    <form *ngIf="paso() === 1; else formularioPaso2" (ngSubmit)="solicitarCodigo()" novalidate>
      <div class="mb-4">
        <label for="correo" class="form-label">Correo electrónico</label>
        <input
          id="correo"
          name="correo"
          type="email"
          class="form-control"
          placeholder="nombre@correo.com"
          autocomplete="email"
          [(ngModel)]="correo"
          (ngModelChange)="limpiarError()"
        />
      </div>
      <button class="btn-gb w-100 py-2" type="submit" [disabled]="cargando()">
        <span [class]="claseSpinner(cargando(), 'fa-paper-plane')"></span>
        {{ cargando() ? 'Enviando...' : 'Enviar código' }}
      </button>
    </form>

    <ng-template #formularioPaso2>
      <form (ngSubmit)="restablecer()" novalidate>
        <div class="mb-3">
          <label for="codigo" class="form-label">Código de 6 dígitos</label>
          <input
            id="codigo"
            name="codigo"
            class="form-control text-center fs-5 numeros"
            inputmode="numeric"
            maxlength="6"
            autocomplete="one-time-code"
            placeholder="••••••"
            [(ngModel)]="codigo"
            (ngModelChange)="limpiarError()"
          />
        </div>
        <div class="mb-3">
          <label for="nueva" class="form-label">Nueva contraseña</label>
          <div class="input-group">
            <input
              id="nueva"
              name="nueva"
              class="form-control"
              autocomplete="new-password"
              [type]="tipoCampoPassword"
              [(ngModel)]="nuevaPassword"
              (ngModelChange)="limpiarError()"
            />
            <button
              class="btn-gb-borde"
              type="button"
              aria-label="Mostrar u ocultar la contraseña"
              (click)="verPassword = !verPassword"
            >
              <i class="fa-solid {{ iconoPassword }}"></i>
            </button>
          </div>
        </div>
        <div class="mb-4">
          <label for="confirmar" class="form-label">Confirmar contraseña</label>
          <input
            id="confirmar"
            name="confirmar"
            class="form-control"
            autocomplete="new-password"
            [type]="tipoCampoPassword"
            [(ngModel)]="confirmarPassword"
            (ngModelChange)="limpiarError()"
          />
        </div>
        <button class="btn-gb w-100 py-2" type="submit" [disabled]="cargando()">
          <span [class]="claseSpinner(cargando(), 'fa-floppy-disk')"></span>
          {{ cargando() ? 'Guardando...' : 'Guardar contraseña' }}
        </button>
        <button class="btn-gb-fantasma w-100 mt-2" type="button" (click)="volverAlPaso1()">
          <i class="fa-solid fa-arrow-left"></i>Cambiar correo o pedir otro código
        </button>
      </form>
    </ng-template>

    <p class="text-center small texto-tenue mt-4 mb-0">
      ¿La recordaste? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
