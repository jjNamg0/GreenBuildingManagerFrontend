<div class="gb-tarjeta">
  <div class="d-flex justify-content-between align-items-center p-3 borde-inferior">
    <div>
      <h2 class="h6 mb-0">Unidades</h2>
      <span class="small texto-tenue">{{ textoAgrupacionConjunto(conjunto.tipo) }}</span>
    </div>
    <button class="btn-gb btn-gb-sm" type="button" (click)="abrirFormulario(null)">
      <i class="fa-solid fa-plus"></i>Nueva unidad
    </button>
  </div>

  <app-cargandocomponent [activo]="cargando()" texto="Cargando unidades..." />

  <app-alertacomponent
    [mensaje]="error()"
    clases="m-3"
    textoAccion="Reintentar"
    (accion)="cargar()"
  />

  <app-vaciocomponent
    [visible]="sinUnidades"
    icono="fa-door-open"
    titulo="Este conjunto aún no tiene unidades"
  />

  <div class="table-responsive" *ngIf="hayUnidades">
    <table class="gb-tabla">
      <thead>
        <tr>
          <th>Unidad</th>
          <th>Tipo</th>
          <th>Residentes</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let unidad of unidades()">
          <td class="fw-medium">{{ unidad.descripcion }}</td>
          <td>
            <span class="gb-insignia neutro">{{ textoTipoUnidad(unidad.tipo) }}</span>
          </td>
          <td class="small">{{ textoResidentes(unidad) }}</td>
          <td class="text-end text-nowrap">
            <button
              class="btn-gb-fantasma btn-gb-sm"
              type="button"
              title="Editar"
              (click)="abrirFormulario(unidad)"
            >
              <i class="fa-solid fa-pen"></i>
            </button>
            <button
              class="btn-gb-fantasma btn-gb-sm texto-rojo"
              type="button"
              title="Eliminar"
              (click)="eliminar(unidad)"
            >
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<app-unidadformcomponent
  *ngIf="formularioAbierto()"
  [conjunto]="conjunto"
  [unidad]="unidadEditada()"
  (cerrar)="formularioAbierto.set(false)"
  (guardado)="alGuardar()"
/>
