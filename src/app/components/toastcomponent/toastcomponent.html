<div class="toast-notificacion" [class.toast-error]="esError()" role="status" aria-live="polite" *ngIf="mensaje()">
  <span class="toast-icono" *ngIf="!esError()"><i class="bi bi-check-lg"></i></span>
  <span class="toast-icono" *ngIf="esError()"><i class="bi bi-x-lg"></i></span>
  <span class="flex-grow-1">{{ mensaje() }}</span>
  <button type="button" class="btn-close" aria-label="Cerrar aviso" (click)="cerrar()"></button>
</div>
