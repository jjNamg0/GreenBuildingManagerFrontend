<div class="gb-auth">
  <div class="gb-auth-tarjeta text-center">
    <span class="gb-icono gb-icono-grande mb-3"><i class="bi" [class.bi-shield-check]="modo === 'cuenta'" [class.bi-shield-lock]="modo === 'login'"></i></span>
    <div class="mb-1" *ngIf="modo === 'login'"><span class="sobretitulo">Acceso de administrador</span></div>
    <h1 class="h4 mb-2">{{ titulo }}</h1>
    <p class="texto-tenue mb-4">
      {{ explicacion }} <strong class="text-body">{{ email }}</strong>
    </p>

    <form (ngSubmit)="verificar()" novalidate>
      <div class="gb-codigo mb-3">
        <div class="gb-codigo-casilla" *ngFor="let casilla of casillas; let i = index"
             [class.vacia]="!casilla" [class.actual]="enfocado && i === codigo.length">{{ casilla }}</div>
        <input class="gb-codigo-entrada" name="codigo" inputmode="numeric" autocomplete="one-time-code"
               maxlength="6" aria-label="Código de 6 números" [ngModel]="codigo" (ngModelChange)="alCambiarCodigo($event)"
               (focus)="enfocado = true" (blur)="enfocado = false" />
      </div>

      <p class="small texto-tenue mb-4"><i class="bi bi-hourglass-split me-1"></i>El código vence en <strong class="text-body">10 minutos</strong></p>

      <div class="gb-alerta peligro mb-3 text-start" *ngIf="error">
        <i class="bi bi-exclamation-circle"></i><span>{{ error }}</span>
      </div>

      <button class="btn-gb w-100 py-2" type="submit" [disabled]="cargando">
        <span *ngIf="cargando" class="spinner-border spinner-border-sm"></span>
        {{ cargando ? 'Verificando...' : 'Verificar' }}
        <i class="bi bi-arrow-right" *ngIf="!cargando"></i>
      </button>
    </form>

    <div class="small mt-4">
      <span class="texto-tenue">¿No te llegó?</span>
      <span class="texto-tenue" *ngIf="segundosParaReenviar > 0">
        Podrás pedir otro en <strong class="text-body numeros">{{ segundosParaReenviar }} s</strong>
      </span>
      <button class="btn btn-link btn-sm p-0 align-baseline" type="button" *ngIf="segundosParaReenviar <= 0"
              (click)="reenviar()">Reenviar código</button>
    </div>

    <hr class="my-4" />
    <a class="small texto-tenue" routerLink="/login"><i class="bi bi-arrow-left me-1"></i>Volver al inicio de sesión</a>
  </div>
</div>
